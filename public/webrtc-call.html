<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>Cuộc gọi - TTVV</title>
    <style>
        :root {
            --bg: #0b1220;
            --panel: #121a2b;
            --panel2: #1a2438;
            --text: #eef2ff;
            --muted: #b7c0d8;
            --ring: rgba(255, 255, 255, .12);
            --glass: rgba(18, 26, 43, .72);
            --danger: #e11d48;
            --danger2: #be123c;
            --ok: #22c55e;
            --warn: #f59e0b;
            --shadow: 0 14px 40px rgba(0, 0, 0, .45)
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .topbar {
            height: 56px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(14, 20, 34, .92);
            border-bottom: 1px solid var(--ring);
            backdrop-filter: blur(10px)
        }

        .title {
            font-weight: 800;
            font-size: 14px;
            max-width: 60vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .sub {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            color: var(--muted);
            font-size: 12px
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid var(--ring);
            background: rgba(255, 255, 255, .05);
            color: #fff
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--warn);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, .18)
        }

        .dot.ok {
            background: var(--ok);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, .18)
        }

        .timer {
            font-variant-numeric: tabular-nums
        }

        .stage {
            flex: 1;
            min-height: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: stretch
        }

        #group-video {
            width: min(1400px, 100%);
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            align-content: center
        }

        .zala-tile {
            position: relative;
            aspect-ratio: 16/9;
            max-height: min(72vh, 620px);
            border: 1px solid var(--ring);
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            box-shadow: var(--shadow)
        }

        .zala-tile video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000
        }

        .badge {
            position: absolute;
            left: 12px;
            bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            max-width: 70%;
            background: rgba(0, 0, 0, .52);
            border: 1px solid rgba(255, 255, 255, .14);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 13px
        }

        .badge img {
            width: 20px;
            height: 20px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, .3)
        }

        .badge span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .controls {
            border-top: 1px solid var(--ring);
            background: rgba(14, 20, 34, .95);
            padding: 12px;
            padding-bottom: max(12px, env(safe-area-inset-bottom))
        }

        .iconbar {
            max-width: 560px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 12px
        }

        .iconbtn {
            width: 56px;
            height: 56px;
            border-radius: 999px;
            cursor: pointer;
            border: 1px solid var(--ring);
            background: rgba(255, 255, 255, .07);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 4px;
            transition: .15s ease;
            position: relative;
            font-size: 0
        }

        .iconbtn:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, .11)
        }

        .iconbtn.off {
            background: rgba(255, 255, 255, .04);
            opacity: .85
        }

        .iconbtn.off::after {
            content: "";
            position: absolute;
            width: 34px;
            height: 2px;
            background: rgba(255, 255, 255, .92);
            transform: rotate(-45deg);
            border-radius: 2px;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, .25)
        }

        .iconbtn.danger {
            background: rgba(225, 29, 72, .95);
            border-color: rgba(225, 29, 72, .35);
            box-shadow: 0 14px 30px rgba(225, 29, 72, .22)
        }

        .iconbtn.danger:hover {
            background: rgba(190, 18, 60, .95)
        }

        .icon {
            width: 22px;
            height: 22px;
            fill: currentColor
        }

        .lbl {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, .85)
        }

        #debug-log {
            max-height: 100px;
            overflow-y: auto;
            font-size: 9px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.85);
            padding: 4px 6px;
            border-radius: 4px;
            margin-top: 4px;
            font-family: monospace;
            line-height: 1.3;
            white-space: pre-wrap;
            word-break: break-all;
            display: none
        }

        @media(max-width:700px) {
            .topbar {
                height: 52px
            }

            .iconbtn {
                width: 48px;
                height: 48px
            }

            .iconbar {
                gap: 10px
            }
        }
    </style>
</head>

<body>
    <div class="topbar">
        <div>
            <div class="title" id="call-title">Cuộc gọi</div>
            <div class="sub">
                <span class="pill"><span class="dot" id="call-dot"></span><span id="call-status">Đang kết
                        nối…</span></span>
                <span class="pill" id="call-type">Video</span>
                <span class="pill"><span id="call-count">1</span> người</span>
            </div>
            <div id="debug-log"></div>
        </div>
        <div class="pill timer" id="call-timer">00:00</div>
    </div>

    <div class="stage">
        <div id="group-video">
            <div class="zala-tile" id="local-tile" data-peer-id="local">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="badge"><img src="https://ui-avatars.com/api/?name=Me&background=4f46e5&color=fff"
                        alt="" /><span>Bạn</span></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="iconbar">
            <button id="btn-mic" class="iconbtn" onclick="toggleMic()">
                <svg class="icon" viewBox="0 0 24 24">
                    <path
                        d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z" />
                </svg>
                <span class="lbl">Mic</span>
            </button>
            <button id="btn-cam" class="iconbtn" onclick="toggleCamera()">
                <svg class="icon" viewBox="0 0 24 24">
                    <path
                        d="M17 10.5V7a2 2 0 0 0-2-2H5A2 2 0 0 0 3 7v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3.5l4 4v-11l-4 4Z" />
                </svg>
                <span class="lbl">Cam</span>
            </button>
            <button class="iconbtn danger" onclick="hangUp()">
                <svg class="icon" viewBox="0 0 24 24">
                    <path
                        d="M21 15.46l-5.27-2.11a1 1 0 0 0-1.12.22l-1.45 1.45a15.05 15.05 0 0 1-4.18-4.18l1.45-1.45a1 1 0 0 0 .22-1.12L8.54 3H3a1 1 0 0 0-1 1 19 19 0 0 0 19 19 1 1 0 0 0 1-1v-5.54Z" />
                </svg>
                <span class="lbl">End</span>
            </button>
        </div>
    </div>

    <!-- SockJS + STOMP.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>

    <script>
        // ─── CONFIG & URL PARAMS ─────────────────────────────────────────────────────
        const params = new URLSearchParams(window.location.search);
        const ROOM_ID = params.get('roomId') || 'demo-room';
        const USER_ID = params.get('userId') || 'demo-user';
        const USERNAME = params.get('username') || 'demo';
        const TOKEN = params.get('token') || '';
        const CALL_TYPE = params.get('callType') || 'video';
        const USER_NAME = params.get('displayName') || USERNAME;
        const USER_AVATAR = params.get('avatar') || '';
        const WS_URL = params.get('wsUrl') || 'http://localhost:8081/ws';
        const API_BASE_URL = params.get('apiBaseUrl') || '';
        const IS_EMBEDDED = params.get('embedded') === '1' || window.self !== window.top;

        // ─── DEBUG LOGGER ────────────────────────────────────────────────────────────
        function dbg(msg) {
            console.log(msg);
            var el = document.getElementById('debug-log');
            if (!el) return;
            el.style.display = 'block';
            var ts = new Date().toLocaleTimeString('vi-VN', { hour12: false });
            el.textContent += ts + ' ' + msg + '\n';
            el.scrollTop = el.scrollHeight;
        }

        // ─── STATE ───────────────────────────────────────────────────────────────────
        let stompClient = null;
        let localStream = null;
        const peers = {};           // peerId → RTCPeerConnection
        const remoteStreams = {};    // peerId → MediaStream (stable per peer)
        const participantProfiles = {}; // userId -> { name, avatar }
        const profileFetchInFlight = {}; // userId -> Promise<void>
        let micMuted = false;
        let camOff = false;

        function fallbackAvatar(name, seed) {
            var safeName = (name || seed || 'User').trim();
            return 'https://ui-avatars.com/api/?name=' + encodeURIComponent(safeName) + '&background=6366f1&color=fff';
        }

        function normalizeText(v) {
            if (v === null || v === undefined) return '';
            var s = String(v).trim();
            if (!s) return '';
            var low = s.toLowerCase();
            if (low === 'undefined' || low === 'null' || low === 'nan') return '';
            return s;
        }

        function getProfile(userId) {
            if (!userId) {
                return { name: 'Người dùng', avatar: fallbackAvatar('User', 'user') };
            }
            var p = participantProfiles[userId];
            if (p) {
                var safeName = normalizeText(p.name) || userId;
                var safeAvatar = normalizeText(p.avatar) || fallbackAvatar(safeName, userId);
                return { name: safeName, avatar: safeAvatar };
            }
            return { name: userId, avatar: fallbackAvatar(userId.substring(0, 2), userId) };
        }

        function shouldResolveName(id, name) {
            var n = normalizeText(name);
            if (!n) return true;
            if (n === id) return true;
            if (/^u\d+$/i.test(n)) return true;
            if (/^[a-f0-9]{16,}$/i.test(n)) return true;
            return false;
        }

        async function fetchUserProfileById(userId) {
            if (!userId) return;
            if (profileFetchInFlight[userId]) return profileFetchInFlight[userId];

            profileFetchInFlight[userId] = (async function () {
                try {
                    var path = '/api/common/users/' + encodeURIComponent(userId);
                    var url = API_BASE_URL ? API_BASE_URL.replace(/\/$/, '') + path : path;
                    var headers = {};
                    if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
                    var resp = await fetch(url, { headers: headers });
                    if (!resp.ok) return;
                    var user = await resp.json();
                    var fullName =
                        normalizeText(user.fullName) ||
                        normalizeText([user.firstName, user.lastName].filter(Boolean).join(' ')) ||
                        normalizeText(user.username) ||
                        userId;
                    var avatar = normalizeText(user.avatar) || fallbackAvatar(fullName, userId);
                    participantProfiles[userId] = { name: fullName, avatar: avatar };
                    refreshPeerBadge(userId);
                } catch (e) {
                    // Silent fallback to id
                } finally {
                    delete profileFetchInFlight[userId];
                }
            })();

            return profileFetchInFlight[userId];
        }

        function refreshPeerBadge(peerId) {
            var tile = document.querySelector('[data-peer-id="' + peerId + '"]');
            if (!tile) return;
            var profile = getProfile(peerId);
            var img = tile.querySelector('.badge img');
            var span = tile.querySelector('.badge span');
            if (img) img.src = profile.avatar;
            if (span) span.textContent = profile.name;
        }

        function upsertProfile(user) {
            if (!user) return;
            var id = user.userId || user.id;
            if (!id) return;
            var prev = participantProfiles[id] || {};
            var nextName =
                normalizeText(user.name) ||
                normalizeText(user.displayName) ||
                normalizeText(user.username) ||
                normalizeText(prev.name) ||
                id;
            var nextAvatar =
                normalizeText(user.avatar) ||
                normalizeText(prev.avatar) ||
                fallbackAvatar(nextName, id);
            participantProfiles[id] = {
                name: nextName,
                avatar: nextAvatar
            };
            refreshPeerBadge(id);
            if (shouldResolveName(id, nextName)) {
                fetchUserProfileById(id);
            }
        }

        participantProfiles[USER_ID] = {
            name: USER_NAME || USER_ID,
            avatar: USER_AVATAR || fallbackAvatar(USER_NAME || USER_ID, USER_ID)
        };

        // ICE servers (STUN + TURN from Metered)
        let iceServers = [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
        ];

        // ─── FETCH TURN SERVERS ──────────────────────────────────────────────────────
        async function fetchTurnServers() {
            try {
                dbg('🌐 Fetching TURN servers...');
                const resp = await fetch('https://zala.metered.live/api/v1/turn/credentials?apiKey=a5e226b1a4b5b60f2117d1b3094e499091ed');
                if (resp.ok) {
                    const servers = await resp.json();
                    iceServers = [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        ...servers
                    ];
                    dbg('✅ TURN OK: ' + servers.length + ' servers');
                }
            } catch (e) {
                dbg('⚠️ TURN fetch err: ' + (e.message || e));
            }
        }

        // ─── UI HELPERS ──────────────────────────────────────────────────────────────
        function setText(id, t) { var e = document.getElementById(id); if (e) e.textContent = t; }
        function setDotOk(ok) { var d = document.getElementById('call-dot'); if (d) d.classList.toggle('ok', !!ok); }

        setText('call-type', CALL_TYPE.toUpperCase() === 'VOICE' ? 'Thoại' : 'Video');
        setText('call-status', 'Đang kết nối…');
        setDotOk(false);

        // Timer
        let t0 = Date.now();
        setInterval(() => {
            var sec = Math.max(0, Math.floor((Date.now() - t0) / 1000));
            var mm = String(Math.floor(sec / 60)).padStart(2, '0');
            var ss = String(sec % 60).padStart(2, '0');
            setText('call-timer', mm + ':' + ss);
        }, 500);

        // Update grid layout
        function updateGrid() {
            var tiles = document.querySelectorAll('[data-peer-id]').length;
            var g = document.getElementById('group-video');
            if (!g) return;
            if (tiles <= 1) g.style.gridTemplateColumns = '1fr';
            else if (tiles <= 4) g.style.gridTemplateColumns = 'repeat(2, 1fr)';
            else g.style.gridTemplateColumns = 'repeat(3, 1fr)';
            setText('call-count', String(tiles));
            if (tiles >= 2) { setText('call-status', 'Đang trong cuộc gọi ✓'); setDotOk(true); }
        }

        // ─── WEBRTC: CREATE PEER CONNECTION ──────────────────────────────────────────
        function createPeerConnection(peerId) {
            dbg('🔧 Creating PC for: ' + peerId);
            var pc = new RTCPeerConnection({ iceServers: iceServers });

            // Add local tracks
            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            // ICE candidates → relay to peer
            pc.onicecandidate = (event) => {
                if (event.candidate && stompClient && stompClient.connected) {
                    stompClient.publish({
                        destination: '/app/call-room/' + ROOM_ID + '/signal',
                        body: JSON.stringify({ to: peerId, type: 'candidate', data: event.candidate })
                    });
                }
            };

            // ICE connection state
            pc.oniceconnectionstatechange = () => {
                dbg('🧊 ICE ' + peerId.substring(0, 8) + ' → ' + pc.iceConnectionState);
                if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
                    setText('call-status', 'Đang trong cuộc gọi ✓');
                    setDotOk(true);
                    window.hasConnectedToSomeone = true;
                } else if (pc.iceConnectionState === 'failed') {
                    setText('call-status', '❌ Kết nối thất bại');
                } else if (pc.iceConnectionState === 'disconnected') {
                    setText('call-status', '⚠️ Mất kết nối peer...');
                }
            };

            // Receive remote tracks
            pc.ontrack = (event) => {
                var track = event.track;
                dbg('📡 ontrack: ' + track.kind + ' from ' + peerId.substring(0, 8) + ' [muted=' + track.muted + ', enabled=' + track.enabled + ']');

                // Use stable stream per peer (avoid srcObject overwrite on multiple ontrack)
                var stableStream = remoteStreams[peerId];
                if (!stableStream) {
                    stableStream = new MediaStream();
                    remoteStreams[peerId] = stableStream;
                }
                if (!stableStream.getTracks().some(t => t.id === track.id)) {
                    stableStream.addTrack(track);
                }

                // Create or update tile
                var div = document.querySelector('[data-peer-id="' + peerId + '"]');
                if (!div) {
                    div = document.createElement('div');
                    div.setAttribute('data-peer-id', peerId);
                    div.className = 'zala-tile';

                    var video = document.createElement('video');
                    video.autoplay = true;
                    video.playsInline = true;

                    var badge = document.createElement('div');
                    badge.className = 'badge';
                    var img = document.createElement('img');
                    var span = document.createElement('span');
                    var profile = getProfile(peerId);
                    img.src = profile.avatar;
                    span.textContent = profile.name;
                    badge.appendChild(img);
                    badge.appendChild(span);
                    div.appendChild(video);
                    div.appendChild(badge);
                    document.getElementById('group-video').appendChild(div);
                    if (shouldResolveName(peerId, profile.name)) {
                        fetchUserProfileById(peerId);
                    }
                }

                var videoEl = div.querySelector('video');
                if (videoEl && videoEl.srcObject !== stableStream) {
                    videoEl.srcObject = stableStream;
                    videoEl.play().catch(e => dbg('Play error: ' + e.message));
                }
                updateGrid();
            };

            return pc;
        }

        // ─── WEBRTC: HANDLE SIGNAL (offer/answer/candidate) ──────────────────────────
        // Giống bài tham khảo: có glare rollback
        async function handleSignal(from, type, data) {
            var pc = peers[from];
            if (!pc) {
                dbg('🔧 [Signal] Creating new PC for: ' + from);
                pc = createPeerConnection(from);
                peers[from] = pc;
            }

            dbg('📰 Signal: ' + type + ' from ' + from.substring(0, 8) + ' state:' + pc.signalingState);

            try {
                if (type === 'offer') {
                    // Glare handling: rollback if we also sent an offer
                    if (pc.signalingState === 'have-local-offer') {
                        dbg('⚡ Glare rollback!');
                        await pc.setLocalDescription({ type: 'rollback' });
                    }
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                    var answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    dbg('📤 Answer sent to ' + from.substring(0, 8));
                    stompClient.publish({
                        destination: '/app/call-room/' + ROOM_ID + '/signal',
                        body: JSON.stringify({ to: from, type: 'answer', data: answer })
                    });
                } else if (type === 'answer') {
                    if (pc.signalingState === 'have-local-offer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(data));
                        dbg('✅ Answer applied from ' + from.substring(0, 8));
                    } else {
                        dbg('⚠️ Ignoring answer, state:' + pc.signalingState);
                    }
                } else if (type === 'candidate') {
                    if (data) {
                        await pc.addIceCandidate(new RTCIceCandidate(data));
                    }
                }
            } catch (err) {
                dbg('❌ Signal err: ' + err.message);
            }
        }

        // ─── REMOVE PEER ─────────────────────────────────────────────────────────────
        function removePeer(peerId) {
            if (peers[peerId]) {
                peers[peerId].close();
                delete peers[peerId];
            }
            delete remoteStreams[peerId];

            var tile = document.querySelector('[data-peer-id="' + peerId + '"]');
            if (tile) tile.remove();

            updateGrid();

            // Check if call ended - end for BOTH 1-on-1 AND group calls when no peers remain
            if (Object.keys(peers).length === 0 && window.hasConnectedToSomeone) {
                dbg('📴 All peers left, call ended');
                notifyParentCallEnded('peer-left');
            }
        }

        // ─── CONTROLS ────────────────────────────────────────────────────────────────
        function toggleMic() {
            if (!localStream) return;
            micMuted = !micMuted;
            localStream.getAudioTracks().forEach(t => { t.enabled = !micMuted; });
            document.getElementById('btn-mic').classList.toggle('off', micMuted);
            document.getElementById('btn-mic').querySelector('.lbl').textContent = micMuted ? 'Muted' : 'Mic';
        }

        function toggleCamera() {
            if (!localStream) return;
            camOff = !camOff;
            localStream.getVideoTracks().forEach(t => { t.enabled = !camOff; });
            document.getElementById('btn-cam').classList.toggle('off', camOff);
            document.getElementById('btn-cam').querySelector('.lbl').textContent = camOff ? 'Off' : 'Cam';
        }

        function hangUp() {
            dbg('📴 Hanging up...');
            // Leave room
            if (stompClient && stompClient.connected) {
                stompClient.publish({
                    destination: '/app/call-room/' + ROOM_ID + '/leave',
                    body: '{}'
                });
            }
            // Close all peers
            for (var id in peers) {
                peers[id].close();
                delete peers[id];
            }
            // Stop local stream
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }
            notifyParentCallEnded('hangup');
        }

        // ─── NOTIFY PARENT (iframe → React app) ─────────────────────────────────────
        function notifyParentCallEnded(reason) {
            if (IS_EMBEDDED && window.parent !== window) {
                try {
                    window.parent.postMessage({ type: 'webrtc-call-ended', reason: reason || 'ended' }, '*');
                } catch (e) { }
            }
        }

        // Listen for parent commands (toggleMute, toggleCamera, hangUp)
        window.addEventListener('message', function (e) {
            var d = e.data;
            if (!d || d.type !== 'webrtc-host-command') return;
            if (d.action === 'toggleMute') toggleMic();
            else if (d.action === 'toggleCamera') toggleCamera();
            else if (d.action === 'hangUp') hangUp();
        });

        // ─── MAIN: INIT ─────────────────────────────────────────────────────────────
        async function init() {
            dbg('🚀 Init: room=' + ROOM_ID + ' user=' + USER_ID + ' type=' + CALL_TYPE);

            // 1. Fetch TURN servers
            await fetchTurnServers();

            // 2. Get local media
            try {
                var constraints = CALL_TYPE === 'voice'
                    ? { audio: true, video: false }
                    : { audio: true, video: { width: { ideal: 1280 }, height: { ideal: 720 } } };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                dbg('✅ Got local stream: ' + localStream.getTracks().map(t => t.kind).join(','));
                document.getElementById('localVideo').srcObject = localStream;
            } catch (e) {
                dbg('❌ getUserMedia error: ' + e.message);
                setText('call-status', '❌ Không truy cập được camera/mic');
                return;
            }

            // 3. Connect STOMP
            connectStomp();
        }

        function connectStomp() {
            dbg('🔌 Connecting STOMP to ' + WS_URL + '...');

            // Use SockJS for STOMP transport
            stompClient = new StompJs.Client({
                webSocketFactory: function () {
                    return new SockJS(WS_URL + '?token=' + TOKEN);
                },
                reconnectDelay: 5000,
                heartbeatIncoming: 10000,
                heartbeatOutgoing: 10000,
                debug: function (str) {
                    // Suppress verbose STOMP debug
                }
            });

            stompClient.onConnect = function (frame) {
                dbg('✅ STOMP connected');

                // Subscribe to personal call-room queue
                stompClient.subscribe('/user/' + USERNAME + '/queue/call-room', function (message) {
                    var event = JSON.parse(message.body);
                    handleRoomEvent(event);
                });

                // Also subscribe to fallback
                stompClient.subscribe('/user/queue/call-room', function (message) {
                    var event = JSON.parse(message.body);
                    handleRoomEvent(event);
                });

                // Join the room
                stompClient.publish({
                    destination: '/app/call-room/' + ROOM_ID + '/join',
                    body: JSON.stringify({
                        userId: USER_ID,
                        name: USER_NAME,
                        avatar: 'https://ui-avatars.com/api/?name=' + encodeURIComponent(USER_NAME) + '&background=4f46e5&color=fff'
                    })
                });

                dbg('📞 Sent join to room: ' + ROOM_ID);
            };

            stompClient.onStompError = function (frame) {
                dbg('❌ STOMP error: ' + frame.headers.message);
            };

            stompClient.activate();
        }

        // Dedupe: track processed event IDs
        const processedEvents = new Set();

        function handleRoomEvent(event) {
            // Simple dedupe by stringifying small events
            var dedupeKey = event.type + ':' + (event.userId || event.from || '') + ':' + (event.signalType || '');
            if (event.type === 'signal' && event.signalType === 'candidate') {
                // Don't dedupe ICE candidates (they are unique)
            } else if (event.type === 'signal') {
                dedupeKey += ':' + Date.now(); // each signal is unique
            }

            dbg('📨 Room event: ' + event.type + (event.signalType ? ' (' + event.signalType + ')' : ''));

            switch (event.type) {
                case 'room-users':
                    handleRoomUsers(event);
                    break;
                case 'user-joined':
                    handleUserJoined(event);
                    break;
                case 'user-left':
                    handleUserLeft(event);
                    break;
                case 'signal':
                    handleSignalEvent(event);
                    break;
            }
        }

        // ─── ROOM EVENTS ─────────────────────────────────────────────────────────────

        // When I join: I receive the list of existing users → create offers to each
        async function handleRoomUsers(event) {
            var users = event.users || [];
            dbg('?? room-users: ' + users.length + ' users');
            users.forEach(upsertProfile);

            for (var u of users) {
                var peerId = u.userId || u.id || u.username;
                if (!peerId || peerId === USER_ID) continue; // skip invalid/self

                dbg('?? Sending offer ? ' + String(peerId).substring(0, 8));
                var pc = createPeerConnection(peerId);
                peers[peerId] = pc;

                var offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                stompClient.publish({
                    destination: '/app/call-room/' + ROOM_ID + '/signal',
                    body: JSON.stringify({ to: peerId, type: 'offer', data: offer })
                });
            }
            updateGrid();
        }

        // When a new user joins: just create PC (they will send offer or we handle signal)
        function handleUserJoined(event) {
            dbg('?? User joined: ' + (event.userId || '').substring(0, 8));
            var peerId = event.userId || event.id || event.username;
            if (!peerId || peerId === USER_ID) return;
            upsertProfile(event);

            // Don't create PC yet - the joiner will send offers (via room-users)
            // Just update badge info if tile exists
            updateGrid();
        }

        function handleUserLeft(event) {
            dbg('❌ User left: ' + (event.userId || '').substring(0, 8));
            removePeer(event.userId);
        }

        function handleSignalEvent(event) {
            var from = event.from || event.userId || event.senderId || event.username;
            var signalType = event.signalType;
            var data = event.data;
            if (!from || from === USER_ID) return; // skip invalid/self
            handleSignal(from, signalType, data);
        }

        // ─── KICK OFF ────────────────────────────────────────────────────────────────
        init();
    </script>
</body>
