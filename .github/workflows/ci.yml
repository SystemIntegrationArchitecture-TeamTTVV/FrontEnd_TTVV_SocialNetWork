# ═══════════════════════════════════════════════════════════════════════════
# TTVV Social Network — Frontend CI/CD Pipeline
# CI: Lint → Test → Build (GitHub Actions)
# CD: Vercel auto-deploy khi push vào main/develop (Vercel tự xử lý)
#
# Flow: Push → GitHub Actions CI (lint + test + build) → Vercel Deploy
# ═══════════════════════════════════════════════════════════════════════════

name: Frontend CI/CD

on:
  push:
    branches: [main, master, develop,22637901-thach]
  pull_request:
    branches: [main, master, develop,22637901-thach]

jobs:
  # ─── CI: Lint + Test + Build ──────────────────────────────────────────
  ci:
    name: Lint → Test → Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # ─── CD: Vercel handles deploy automatically ─────────────────────────
  # Vercel đã kết nối GitHub repo → auto-deploy khi push:
  #   • Push vào main/master  → Production deploy
  #   • Push vào develop      → Preview deploy
  #   • Pull Request           → Preview deploy
  #
  # Không cần GitHub Actions deploy vì Vercel đã lo.
  # Xem dashboard: https://vercel.com/dashboard
